# Nachi against the *published* nexus-a2a release, as any outside user would install it.
# Must pass before merging. The contract tests start real agents on local ports and run
# `nexus verify` against them (the Phase 0 gate).
name: release

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (nexus-a2a from PyPI, ignoring the local path source)
        run: uv sync --no-sources
      - name: Lint
        run: |
          uv run --no-sources ruff check .
          uv run --no-sources ruff format --check .
      - name: Type check
        run: uv run --no-sources mypy
      - name: Unit tests
        run: uv run --no-sources pytest -m "not contract and not flow and not fault"
      - name: Contract tests (real agents on local ports + nexus verify)
        run: uv run --no-sources pytest -m contract
      - name: Flow and fault tests (whole network over A2A, restarts mid-session)
        run: uv run --no-sources pytest -m "flow or fault"
